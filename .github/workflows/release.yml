# Builds the mod and publishes a GitHub release whenever a version tag is pushed.
#
# Nothing here is done by hand and nothing is done by an outside account: the release is created with
# the repository's own token by `gh`, which every runner already has, so no third-party action
# publishes anything and no contributor is added to the repository by publishing a release.
#
#     git tag v0.1.0
#     git push origin v0.1.0
#
# The notes players read are .github/release-notes.md, edited in the repository rather than typed
# into the release form, so what a release says is reviewable in a pull request.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The tag is the name players download by, and the jar's own name comes from gradle.properties.
      # A tag that disagrees with the version inside would publish a file whose name contradicts the
      # release it is attached to, so it stops here instead.
      - name: Check the tag against the mod version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -m1 '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')"
          echo "tag: ${GITHUB_REF_NAME}, mod_version: ${version}"
          if [ "${tag}" != "${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match mod_version ${version} in gradle.properties"
            exit 1
          fi
          echo "version=${tag}" >> "${GITHUB_OUTPUT}"
          echo "minecraft=$(grep -m1 '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '\r')" >> "${GITHUB_OUTPUT}"

      # The same build the development workflow runs.
      - name: Build
        run: ./gradlew build

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          title="Background Utilities ${tag}"

          jars=$(ls build/libs/*.jar 2>/dev/null | wc -l)
          if [ "${jars}" -eq 0 ]; then
            echo "::error::the build produced no jar in build/libs"
            exit 1
          fi

          # Re-running a tag's workflow updates that release rather than failing on it.
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release edit "${tag}" --title "${title}" --notes-file .github/release-notes.md
            gh release upload "${tag}" build/libs/*.jar --clobber
          else
            gh release create "${tag}" --title "${title}" --notes-file .github/release-notes.md build/libs/*.jar
          fi

      # What changed in this version, for Modrinth's changelog: the commit subjects since the previous
      # tag, which is what a changelog is. The release notes are deliberately not used for this — they
      # describe the mod, not the release — and commit subjects here are written to be read as entries.
      - name: Changelog for this version
        id: changelog
        run: |
          previous="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          {
            echo 'changelog<<CHANGELOG'
            if [ -n "${previous}" ]; then
              git log --no-merges --pretty='- %s' "${previous}..${GITHUB_REF_NAME}"
            else
              echo 'First release.'
            fi
            echo 'CHANGELOG'
          } >> "${GITHUB_OUTPUT}"

      # The same release, on Modrinth, once the repository is told where to put it:
      #
      #   a variable  MODRINTH_ID     the project's id or slug
      #   a secret    MODRINTH_TOKEN  a personal access token with the CREATE_VERSION scope
      #
      # Until both are set this step is skipped, and a release is the GitHub one alone. Modrinth's own
      # route is Minotaur, a Gradle plugin, which would put publishing inside the build; this keeps it
      # out, so nothing about Modrinth can stop the mod being built. That is also why the failure mode
      # is a warning: by the time this runs, the release above has already happened, and a Modrinth
      # outage or a stale token should not be reported as a failed release.
      - name: Publish to Modrinth
        if: ${{ env.MODRINTH_ID != '' && env.MODRINTH_TOKEN != '' }}
        env:
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        uses: Kir-Antipov/mc-publish@v3
        with:
          modrinth-id: ${{ env.MODRINTH_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          modrinth-name: Background Utilities ${{ github.ref_name }}
          modrinth-version: ${{ steps.version.outputs.version }}
          modrinth-version-type: alpha
          modrinth-environment: client | server
          modrinth-changelog: ${{ steps.changelog.outputs.changelog }}
          modrinth-loaders: neoforge
          modrinth-game-versions: ${{ steps.version.outputs.minecraft }}
          # The dependency set version 0.1.0 carries, so an automated release does not arrive bare.
          # mc-publish reads these from the project's metadata file by default, but this project keeps
          # its metadata as a template that is expanded at build time, so the list is declared here.
          # These are Modrinth slugs, not mod ids: they differ for two of the four.
          modrinth-dependencies: |
            ldlib(required)
            embers-text-api(required)
            symbol-chat(optional)
            photon-editor(optional)
          modrinth-fail-mode: warn
