plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // ember's text api
    maven { url 'https://maven.tysontheember.dev' }
    // ldlib2
    maven { url = "https://maven.firstdark.dev/snapshots" }
    // Sinytra Connector, the Forgified Fabric API and Symbol Chat: the bridge that lets a Fabric mod
    // load on NeoForge, and the two mods it is there for. Modrinth's maven serves the same files their
    // download pages do, and this build has fetched all three from it. The group filter keeps this
    // repository from being consulted for anything else.
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Read once, here: reaching for `project` inside the run configurations below is what Gradle
// deprecates (the closures may be evaluated after the project is configured), and a local
// captures the value while it is still configuration time.
def modId = mod_id

// Read once for the same reason: the Symbol Chat compatibility run gets a game directory of its own,
// so that the mods Connector brings are never mixed into the ordinary run.
def compatRunDir = file('run-symbolchat')

// The CIT Resewn stack gets a game directory of its own as well: RP Renames and CIT Resewn are both
// Fabric mods that only load here through Connector, and CITResewnNeoPatcher is the NeoForge mod that
// keeps CIT Resewn working under it. Two mods that rewrite how the game loads have no business in the
// run where this mod is tested on its own.
def citRunDir = file('run-citresewn')

// Connector will not start in a dev run until it is told where the *clean* Minecraft jar is. In
// production it works that path out for itself, from the launcher's libraries; on a dev classpath
// there is nothing for it to work out, and it gives up with "Could not determine clean minecraft
// artifact path", which is exactly what the first attempt at this run did. NeoForm keeps the artifact
// it wants — the game mapped, before NeoForge patched it — in its cache, so it is found here and
// handed over through the property Connector reads.
//
// Overridable, because a Gradle cache belongs to Gradle and may be cleaned or moved:
//     -PconnectorCleanJar=<path to a mapped, unpatched Minecraft jar>
def connectorCleanJar = {
    def overridden = findProperty('connectorCleanJar')
    if (overridden != null) return file(overridden)
    def cache = new File(gradle.gradleUserHomeDir, 'caches/neoformruntime/intermediate_results')
    def found = cache.listFiles({ File f -> f.isFile() && f.name.startsWith('rename_') && f.name.endsWith('_output.jar') } as FileFilter)
    return found == null || found.length == 0 ? null : found.sort { it.lastModified() }.last()
}()

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', modId
        }

        // The dedicated server, in a game directory of its own. A server and a client cannot share
        // one, and this run is only worth having beside a client: the point of it is to join it and
        // watch what the server half of every feature does on its own, which is the half a single
        // player never exercises. run-server/ holds that server's settings — its own port, offline
        // mode, and an ops entry for the dev player — and is ignored by git, so the world, the logs
        // and the databases it writes stay out of the repository.
        server {
            server()
            programArgument '--nogui'
            gameDirectory = file('run-server')
            systemProperty 'neoforge.enabledGameTestNamespaces', modId
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', modId
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', modId, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // Symbol Chat is a Fabric mod, so it can only be loaded here through Sinytra Connector and the
        // Forgified Fabric API, which rewrite parts of the game as they load. Those three therefore go
        // into a game directory of their own rather than into run/, so that the ordinary client keeps
        // running without them; this run exists to exercise the item editor's symbol button. Its jars
        // are put in place by installCompatMods, which this run depends on.
        symbolChat {
            client()
            gameDirectory = compatRunDir
            // See connectorCleanJar above: without this Connector aborts the whole load in a dev run.
            if (connectorCleanJar != null) {
                systemProperty 'connector.clean.path', connectorCleanJar.absolutePath
            }
        }

        // RP Renames, CIT Resewn and CITResewnNeoPatcher, in a third game directory, for the one
        // thing that cannot be tested anywhere else: the creative tab RP Renames registers. It shows
        // when RP Renames is on its own, and disappears once CIT Resewn and its patcher are loaded
        // beside it. Their jars are put in place by installCitMods, which this run depends on.
        citResewn {
            client()
            gameDirectory = citRunDir
            if (connectorCleanJar != null) {
                systemProperty 'connector.clean.path', connectorCleanJar.absolutePath
            }
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime

    // The Symbol Chat compatibility stack: Connector and its Forgified Fabric API are what let Symbol
    // Chat, a Fabric mod, load on a NeoForge client. It is a configuration of its own rather than a
    // dependency of this mod, because none of the three is compiled against, bundled, or required —
    // they are installed into one dedicated run, and the integration is reached reflectively whether
    // they are installed or not.
    compatMods {
        canBeConsumed = false
        canBeResolved = true
    }

    // The CIT Resewn compatibility stack: RP Renames and CIT Resewn, both Fabric, and the NeoForge
    // patcher that keeps CIT Resewn working through Connector. None of them is compiled against or
    // bundled; they are installed into the citResewn run alone. Connector and the Forgified Fabric
    // API come from compatMods, which that run installs as well.
    citMods {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    implementation 'net.tysontheember.emberstextapi:emberstextapi-neoforge-1.21.1:3.0.3'

    implementation("com.lowdragmc.ldlib2:ldlib2-neoforge-${minecraft_version}:${ldlib2_version}:all")

    jarJar(implementation('org.xerial:sqlite-jdbc:3.53.2.0')) {
        version {
            strictly '[3.53.2.0]'
            prefer '3.53.2.0'
        }
    }

    additionalRuntimeClasspath 'org.xerial:sqlite-jdbc:3.53.2.0'

    // Photon is compiled against, never bundled, and optional at runtime: the effect tool's
    // Photon-backed feature simply switches off when the mod is absent, so nothing here may be
    // jarJar'd or declared implementation.
    //
    // Transitives off, deliberately. The POM pins ldlib2 2.2.40, and this build already runs
    // 2.2.41 under implementation; letting Photon's transitive pull in would put two versions on
    // the compile classpath and let javac pick a method from either. Photon also brings
    // kilagraph, which is Photon's own runtime concern, not ours to compile against.
    //
    // Photon's own classes must only ever be reached from client code: see the client-only gate
    // the effect tool's preview and placement already go through. A dedicated server never loads
    // them.
    compileOnly("com.lowdragmc.photon:photon-neoforge-${minecraft_version}:${photon_version}") {
        transitive = false
    }

    // The dev runs need the mod itself, not just its classes: a compileOnly entry is on the
    // compile classpath alone, so without this the feature would be untestably off in runClient.
    // runtimeOnly rather than additionalRuntimeClasspath, which ModDevGradle reserves for libraries
    // that declare no FMLModType and rejects game mods from.
    runtimeOnly "com.lowdragmc.photon:photon-neoforge-${minecraft_version}:${photon_version}"

    // The newest builds published for 1.21.1, each named in gradle.properties so a version that the
    // symbolChat run rejects can be corrected without touching this file. Symbol Chat itself is pinned
    // to the 1.21.1 build (1.2.8), which is the one whose panel this mod's integration was written
    // against; Connector, at 2.0.0-beta.17, is the last Connector built for 1.21.1.
    compatMods "maven.modrinth:connector:${connector_version}"
    compatMods "maven.modrinth:forgified-fabric-api:${forgified_fabric_api_version}"
    compatMods "maven.modrinth:symbol-chat:${symbolchat_version}"

    // The stack the citResewn run installs, newest 1.21.1 builds of each. RP Renames has no NeoForge
    // build on 1.21.1 - its NeoForge line begins at 0.12.0, on a later Minecraft - so the Fabric jar
    // through Connector is the only route to it here, and the patcher is what makes CIT Resewn
    // survivable in that arrangement. Versions live in gradle.properties so one the run rejects can
    // be changed without touching this file.
    citMods "maven.modrinth:rp-renames:${rprenames_version}"
    citMods "maven.modrinth:cit-resewn:${citresewn_version}"
    citMods "maven.modrinth:cit-resewn-neopatcher:${citresewn_neopatcher_version}"
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// The Symbol Chat compatibility stack, installed where a Fabric mod can be loaded on NeoForge.
//
// Copy rather than Sync, deliberately: a jar dropped into that folder by hand must never be deleted by
// a build, so emptying the folder is left to cleanCompatMods. The symbolChat run cannot see the jars
// unless they are already on disk, which is why downloading them is part of that run.
var installCompatMods = tasks.register('installCompatMods', Copy) {
    group = 'backutils'
    description = 'Downloads Sinytra Connector, the Forgified Fabric API and Symbol Chat into the symbolChat run.'
    from configurations.compatMods
    into new File(compatRunDir, 'mods')
}

tasks.register('cleanCompatMods', Delete) {
    group = 'backutils'
    description = 'Removes the downloaded Symbol Chat compatibility stack.'
    delete new File(compatRunDir, 'mods')
}

// The same arrangement for the CIT Resewn stack: Connector and its Fabric API out of compatMods, and
// RP Renames, CIT Resewn and the patcher out of citMods.
var installCitMods = tasks.register('installCitMods', Copy) {
    group = 'backutils'
    description = 'Downloads RP Renames, CIT Resewn and CITResewnNeoPatcher, with Connector and its Fabric API, into the citResewn run.'
    from configurations.compatMods
    from configurations.citMods
    into new File(citRunDir, 'mods')
}

tasks.register('cleanCitMods', Delete) {
    group = 'backutils'
    description = 'Removes the downloaded CIT Resewn compatibility stack.'
    delete new File(citRunDir, 'mods')
}

// configureEach rather than named, so that nothing here depends on when the run's task is registered.
tasks.configureEach {
    if (name == 'runSymbolChat') dependsOn installCompatMods
    if (name == 'runCitResewn') dependsOn installCitMods
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
