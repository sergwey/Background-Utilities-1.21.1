# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

#read more on this at https://github.com/neoforged/ModDevGradle?tab=readme-ov-file#better-minecraft-parameter-names--javadoc-parchment
# you can also find the latest versions at: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.21.1
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[1.21.1]
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=21.1.250
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=backutils
# The human-readable display name for the mod.
mod_name=Background Utils
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=GPL-3.0-only
# The mod version. See https://semver.org/
# 0.1.0 is tagged already, and neither a tag nor a Modrinth version number can be reused, so a fix
# that is to be released gets the next patch number.
mod_version=0.1.3
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=net.xlebupaksa.backutils

#ldlib2 version

ldlib2_version=2.2.41

#photon version
#
# Photon is compiled against but never bundled, and is optional at runtime: the effect tool's
# Photon-backed feature switches off when the mod is absent. Photon 2.2.7 itself asks for ldlib2
# 2.2.40, and this build runs 2.2.41, which satisfies it.
photon_version=2.2.7

#Symbol Chat compatibility (optional)
#
# Symbol Chat is a Fabric mod, so it needs Sinytra Connector and the Forgified Fabric API to load on a
# NeoForge client. All three are used by the symbolChat run alone: the mod is never compiled against
# any of them, never bundles them, and behaves the same without them. They are the newest builds
# published for 1.21.1, and they are properties so that a version the run rejects can be changed here.
symbolchat_version=1.2.8
connector_version=2.0.0-beta.17+1.21.1
forgified_fabric_api_version=0.116.15+2.3.5+1.21.1

#CIT Resewn compatibility (optional)
#
# RP Renames and CIT Resewn are both Fabric mods, so both load here through Sinytra Connector; the
# patcher is the NeoForge mod that keeps CIT Resewn working there. RP Renames has no NeoForge build for
# 1.21.1 at all, so this is the only way to run it on this version, and it is why the patcher exists.
# All three are installed into the citResewn run alone. The patcher's own compatibility table names CIT
# Resewn 1.2.2+1.21 as the build it was written against, and the newest 1.21.1 builds of each are used.
citresewn_version=1.2.2+1.21
citresewn_neopatcher_version=1.3.0
rprenames_version=0.9.2
